services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: python -c "print('Stage 1 API placeholder. FastAPI starts in Stage 2.')"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend:ro
    depends_on:
      - postgres
      - redis

  worker:
    image: python:3.12-slim
    working_dir: /app
    command: python -c "print('Stage 1 worker placeholder. Celery starts in Stage 4.')"
    env_file:
      - .env
    volumes:
      - ./worker:/app/worker:ro
      - ${HOST_MODEL_ROOT:-./models}:/models:ro
    depends_on:
      - redis
      - minio

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "echo 'Stage 1 frontend placeholder. Next.js app starts in Stage 6.'"
    env_file:
      - .env
    volumes:
      - ./frontend:/app:ro
    ports:
      - "${FRONTEND_PORT:-3001}:3001"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flux_platform}
      POSTGRES_USER: ${POSTGRES_USER:-flux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flux_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6380"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flux_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flux_minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:
