services:
  api:
    build:
      context: ./backend
    working_dir: /app
    command: >
      python -m debugpy
      --listen 0.0.0.0:5678
      -m uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./model_configs:/app/model_configs:ro
    ports:
      - "${API_PORT:-8000}:8000"
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    profiles:
      - local-worker
    build:
      context: .
      dockerfile: worker/Dockerfile
    working_dir: /app
    command: >
      python -m debugpy
      --listen 0.0.0.0:5679
      -m celery
      -A worker.app.celery_app
      worker
      --loglevel=info
      -Q generation:high,generation:normal,generation:low
      -c 1
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./model_configs:/app/model_configs
      - ./worker:/app/worker
      - ${HOST_MODEL_ROOT:-./models}:/models:ro
    ports:
      - "5679:5679"
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    working_dir: /app
    command: npm run dev
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3001}:${FRONTEND_PORT:-3001}"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flux_platform}
      POSTGRES_USER: ${POSTGRES_USER:-flux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flux_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-flux} -d $${POSTGRES_DB:-flux_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flux_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flux_minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
  prometheus_data:
  grafana_data:
